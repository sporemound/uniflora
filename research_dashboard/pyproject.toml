[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-interior-research-dashboard"
version = "0.1.0"
description = "Isolated local Panel and HoloViews research dashboard for The Missing Interior."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bokeh>=3.8,<4",
  "colorcet>=3.1,<4",
  "cartopy>=0.24,<1",
  "dask[dataframe]>=2025.1,<2027",
  "datashader>=0.19,<1",
  "duckdb>=1.3,<2",
  "dynamical-catalog~=0.8.0",
  "geoviews>=1.15,<2",
  "holoviews>=1.23,<2",
  "hvplot>=0.12,<1",
  "intake>=2,<3",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "panel>=1.9,<2",
  "param>=2.4,<3",
  "pillow>=11,<13",
  "pyarrow>=18,<24",
  "pyproj>=3.7,<4",
  "resvg_py>=0.3,<1",
  "scipy>=1.14,<2",
  "spatialpandas>=0.5,<1",
  "xarray>=2025.1",
  "xyzservices>=2025.4,<2027",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.9,<1",
]
large-data = [
  "tsdownsample>=0.1,<1",
]

[project.scripts]
missing-interior-dashboard = "missing_interior_dashboard.cli:main"
missing-interior-dynamical-map = "missing_interior_dashboard.dynamical_export:main"

[tool.setuptools]
packages = ["missing_interior_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
