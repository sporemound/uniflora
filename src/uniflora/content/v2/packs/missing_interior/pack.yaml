endings:
  corrective:
    presentation_id: missing_interior_corrective_ending
    prose: 'At 04:11, the final packet returns to the Quantum State Institute because Section 7-C identifies an observation
      basis whose issuing office cannot be located.


      No one is surprised.


      The reconstruction can produce an interior viewpoint under synchronized conditions, but the viewpoint shifts when poorly
      constrained bases are withheld. Several dependencies remain administrative rather than physical: copied records, fused
      products without raw feeds, reconstruction priors, and transient observations that cannot be repeated.


      The network has found a way to describe an inside that no individual facility can occupy. It has not shown that the
      inside belongs to an object, an entity, or a quantum system.


      Hypha adds a collection request, clips it to the front of the file, and returns the folder to circulation.


      The corridor lights remain on.


      _The interior can be approached. The record is not ready to stop moving._'
  baseline:
    presentation_id: missing_interior_baseline_ending
    prose: 'At 04:11, the final packet is accepted with annotations.


      A records clerk places three limitation sheets behind the conclusion and one in front of it, as required by separate
      policies. The effective state can be reconstructed under declared bases, calibration assumptions, and synchronization
      conditions. The interior viewpoint remains conditional but reproducible within those bounds.


      No exterior instrument sees it alone.


      Nothing in the result proves that the phenomenon is quantum, conscious, intentional, or even singular. What has changed
      is the network’s position relative to its own evidence: six institutions can now describe a perspective that none possesses
      independently.


      Hypha enters the conclusion into the distributed record.


      The printer produces one blank separator page.


      No one removes it.


      _The missing interior is not a place the network found. It is a view the network learned how to take._'
  advanced:
    presentation_id: missing_interior_advanced_ending
    prose: 'At 04:11, three independently prepared reconstructions complete within the same minute.


      The clocks still disagree about which minute.


      Across alternate priors, withheld facilities, incompatible bases, and reconstruction families, the interior viewpoint
      persists inside declared uncertainty. It changes when the measurement network changes, but it does not collapse into
      any single instrument, record, source location, or physical model.


      The result is unusually constrained.


      It is still not ontology.


      A density matrix remains on the central display while the final report waits beside three routing trays: **PHYSICAL**,
      **INFORMATIONAL**, and **OTHER**. After a long interval, the clerk files it under all three and notes the duplication
      as intentional.


      Hypha closes the observation window.


      For several seconds, every facility reports the same time.


      Then the clocks resume their ordinary disagreement.


      _The network did not discover what occupied the interior. It discovered the conditions under which an interior could
      look back._'
