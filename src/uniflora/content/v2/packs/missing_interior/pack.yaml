      presentation_id: archive_convergence_corrective_opening
      prologue: The aviation packet arrives under a single confident case title, while its contradictory bearings and
        missing feed survive only in attachments. Players receive a guided dependency map and must complete
        separate_derived_aviation_claims.
      guidance:
      - Separate source observations from derived trajectory claims.
      - Verify attached contradictory bearings before recurrence comparison.
      required_action_id: separate_derived_aviation_claims
    baseline:
      presentation_id: archive_convergence_baseline_opening
      prologue: The ordinary archive opening plays unchanged. Players trace accessions, terminology, copying, and
        selection bias through the standard tools.
      guidance:
      - Follow the ordinary evidence order and interface guidance.
    advanced:
      presentation_id: archive_convergence_advanced_opening
      prologue: The handoff preserves every source boundary and unresolved trajectory divergence. The archive unlocks an
        extended recurrence-sampling matrix and optional source-withholding comparison.
      guidance:
      - Declare sampling assumptions before the optional withholding comparison.
      optional_action_ids:
      - compare_source_withholding_samples
  completion:
    minimum_examined_source_classes: 3
    minimum_confirmation_count: 1
    required_completed_action_ids:
