instruments:
- id: optical_array
  name: Directional Optical Array
  location_id: boundary_array
  intended_purpose: Records directional optical intensity and synchronized timing changes across the documented field of
    view.
  operational_reliability: The pre-event alignment check and timing self-test passed within the recorded operating
    tolerance.
  scientific_suitability: Suitable for relative direction, intensity, and timing comparisons; unsuitable for directly
    determining distance, physical size, or material composition.
  calibration_status: Current calibration record and pre-event self-test are available.
  alignment_status: Array alignment was checked before the event.
  resolution: Directional intensity samples at the configured recorder cadence.
  coverage_limits:
  - Low-elevation sectors are partly occluded by terrain and service structures.
  - Several samples reached saturation, preventing recovery of peak brightness.
  assumptions:
  - Recorder timestamps remained within the documented synchronization tolerance.
- id: radio_receiver
  name: Directional Radio Receiver
  location_id: boundary_array
  intended_purpose: Records directional activity inside the configured radio-frequency range and preserves receiver
    status with each acquisition.
  operational_reliability: The receiver passed its pre-event operational self-test, but its post-event direction-finding
    diagnostic was incomplete at initial review.
  scientific_suitability: Suitable for timing and spectral comparison within the configured band; unsuitable for
    inferring object size, shape, composition, or emission power without independent evidence.
  calibration_status: Pre-event self-test passed; post-event diagnostic incomplete.
  alignment_status: Direction-finding baseline requires post-event verification.
  resolution: Configured frequency bins and receiver timestamp cadence.
  coverage_limits:
  - Out-of-band activity was not recorded.
  - Automatic gain control changes the meaning of reported amplitude.
  assumptions:
  - Receiver clock drift remained within its last measured range.
  - Firmware filtering behaved according to the recorded configuration.
- id: weather_station
  name: Local Weather Station
  location_id: boundary_array
  intended_purpose: Records local temperature, pressure, humidity, wind, visibility, and precipitation near the array.
  operational_reliability: Routine maintenance and local sensor checks were current at the event time.
  scientific_suitability: Suitable for local environmental context; insufficient by itself to describe the full optical
    or radio propagation path above and beyond the site.
  calibration_status: Routine maintenance and sensor checks current.
  resolution: Local station observations at the configured sampling interval.
  coverage_limits:
  - The station does not measure the complete vertical atmospheric profile.
  - Regional conditions require records from outside the Boundary Array.
  assumptions:
  - Local measurements represent conditions only near the installation.
- id: communications_recorder
  name: Air-Traffic Communications Recorder
  location_id: aeronautical_incident_center
  intended_purpose: Preserves controller and aircraft radio audio with operational timestamps and channel assignment
    metadata for incident review.
  operational_reliability: The recorder continuity check passed for the incident window, with one documented channel
    handoff and no detected audio gap in the retained segment.
  scientific_suitability: Suitable for reconstructing spoken reports and relative timing; unsuitable for directly
    measuring distance, velocity, size, or material composition.
  calibration_status: Recorder clock offset and channel assignment record are documented.
  alignment_status: Operational clock was compared with the center reference after the event.
  resolution: Recorded audio and system timestamps at the configured communications cadence.
  coverage_limits:
  - Only transmissions routed through recorded center channels are preserved.
  - Spoken bearings remain human reports rather than instrument-derived coordinates.
  assumptions:
  - The documented clock correction applies across the retained incident segment.
- id: surveillance_radar_archive
  name: Primary Surveillance Plot Archive
  location_id: aeronautical_incident_center
  intended_purpose: Retains thresholded primary-surveillance plots used for operational traffic separation and later
    incident reconstruction.
  operational_reliability: The sensor was in operational service, but the archive stores plot products rather than the
    full receiver waveform or every rejected detection.
  scientific_suitability: Suitable for testing whether the system generated plots at particular times and bearings;
    unsuitable for deriving exact size, shape, composition, or a unique path without processing details and independent
    geometry.
  calibration_status: Operational maintenance status was current for the incident shift.
  alignment_status: Recorded azimuth alignment tolerance is available; range bias is bounded operationally.
  resolution: Retained thresholded plots at the archive reporting cadence.
  coverage_limits:
  - The archive omits rejected detections and the underlying analog or digital waveform.
  - Terrain, beam geometry, and sensitivity vary across the covered airspace.
  assumptions:
  - Archived plot timestamps were converted using the recorded center clock correction.
  - Operational thresholding followed the configuration listed in the incident record.
- id: transponder_data_archive
  name: Cooperative Navigation Data Archive
  location_id: aeronautical_incident_center
  intended_purpose: Preserves position, identity, and status messages from participating aircraft for traffic management
    and incident reconstruction.
  operational_reliability: Known aircraft records are internally consistent after the documented coordinate and time
    conversions.
  scientific_suitability: Suitable for locating cooperative aircraft and testing misidentification scenarios; absence of
    a matching report does not measure or characterize a non-cooperative return.
  calibration_status: Decoder and coordinate-conversion versions are recorded.
  alignment_status: Coordinates were normalized to the incident reconstruction frame.
  resolution: Message positions and timestamps at each participating aircraft reporting interval.
  coverage_limits:
  - Only cooperative transmissions received by the covered network are represented.
  - Reported positions inherit aircraft navigation and transmission uncertainty.
  assumptions:
  - Aircraft identity associations in the export follow the recorded operational rules.
- id: incident_fusion_console
  name: Incident Fusion Console
  location_id: aeronautical_incident_center
  intended_purpose: Correlates operational sensor plots, cooperative-aircraft records, and operator annotations into
    tracks for traffic management and incident review.
  operational_reliability: The console reproduced the stored incident display from its retained inputs and configuration
    record.
  scientific_suitability: Suitable for reviewing how operational products were associated and displayed; a fused track
    is a processing result, not a direct physical measurement.
  calibration_status: Software build, association settings, and clock-conversion record are retained.
  alignment_status: Input coordinate frames were transformed using the logged operational configuration.
  resolution: Track states at the configured update and display cadence.
  coverage_limits:
  - Some contributing systems retained only processed products rather than raw data.
  - Track continuity can include prediction, association, and interpolation between updates.
  assumptions:
  - The reproduced display uses the same association and smoothing settings as the incident window.
- id: archive_provenance_index
  name: Archive Provenance Index
  location_id: aerial_phenomena_archive
  intended_purpose: Records accession history, custody transfers, derivative relationships, citation links, record
    level, and known missing holdings for each selected case.
  operational_reliability: Integrity checks pass for indexed holdings, but early accessions include retrospective
    entries and incomplete custody metadata.
  scientific_suitability: Suitable for testing provenance and source dependence; unsuitable for treating an indexed
    claim as corroboration or absence from the index as evidence of absence.
  calibration_status: Index checksums, schema version, and edit history are retained.
  alignment_status: Case dates, locations, and record levels use documented normalization rules.
  resolution: One record-level entry per retained item, derivative, or known missing holding.
  coverage_limits:
  - Unarchived private collections and destroyed records remain outside the index.
  - Unknown dependency edges are recorded as unknown rather than independent.
  assumptions:
  - Recorded custody and citation links are incomplete when the source file says they are unknown.
- id: document_imaging_station
  name: Document Imaging Station
  location_id: aerial_phenomena_archive
  intended_purpose: Produces preservation images of drawings, photographs, annotations, and paper records with color
    targets, scale references, and transformation logs.
  operational_reliability: Reference targets and capture checks pass for the current imaging session; several historical
    reproductions predate standardized capture practice.
  scientific_suitability: Suitable for documenting the retained artifact and later alterations; unsuitable for
    recovering the witness viewpoint, scene geometry, or lost original media.
  calibration_status: Current color, focus, scale, and geometric-distortion checks are recorded.
  alignment_status: Page rotation and crop are logged without replacing the preservation master.
  resolution: Preservation master and access derivative at documented pixel density.
  coverage_limits:
  - A reproduction cannot restore detail absent from the surviving artifact.
  - Later redraws preserve later testimony, not the original moment of observation.
  assumptions:
  - The accession link correctly identifies the surviving artifact and its generation.
- id: case_normalization_workbench
  name: Case Normalization Workbench
  location_id: aerial_phenomena_archive
  intended_purpose: Compares dates, coordinate frames, bearings, terminology, record levels, and uncertainty across
    heterogeneous cases while retaining every original field.
  operational_reliability: Fixed inputs and rules reproduce the same crosswalk, dependency weights, and comparison
    matrix.
  scientific_suitability: Suitable for testing recurrence under explicit normalization and selection rules; unsuitable
    for proving that similar constraints share one cause.
  calibration_status: Reference cases, conversion rules, and software version are recorded.
  alignment_status: Temporal and spatial frames are normalized with case-specific uncertainty bounds.
  resolution: Case-level constraints with source-level uncertainty and dependency weights.
  coverage_limits:
  - Sparse or narrative-only cases produce broad constraint regions.
  - The comparison set is limited by archival survival and selection criteria.
  assumptions:
  - Normalization preserves original values and does not increase their precision.
- id: coherent_wavefront_bench
  name: Coherent Wavefront Calibration Bench
  location_id: holography_laboratory
  intended_purpose: Measures reference interference fields, optical-path drift, detector response, and phase-unwrapping
    behavior using traceable calibration targets.
  operational_reliability: Reference runs reproduce within the recorded tolerance during the session; reliability
    outside the calibrated wavelength, geometry, and detector range is not assumed.
  scientific_suitability: Suitable for characterizing the laboratory reconstruction chain and testing
    instrument-generated artifacts; unsuitable for calibrating the historical or operational sensors that produced
    remote inputs.
  calibration_status: Current path-length, detector-linearity, reference-flatness, and phase-step checks are retained
    with raw interferograms and uncertainty estimates.
  alignment_status: Reference target pose and optical-axis alignment are measured before and after the reconstruction
    series.
  resolution: Phase response is characterized at the bench sampling interval and reported with detector and unwrapping
    limits.
  coverage_limits:
  - Bench calibration does not recover phase information never recorded by source institutions.
  - Synthetic targets cannot reproduce every processing history present in archival and operational records.
  assumptions:
  - Reference materials remain stable within the documented environmental tolerance.
  - The retained calibration session represents the reconstruction hardware used for the reported outputs.
- id: multi_source_registration_workbench
  name: Multi-Source Registration Workbench
  location_id: holography_laboratory
  intended_purpose: Places optical, radio, aviation, and dependency-weighted archival constraints into common temporal,
    angular, and spatial frames with explicit uncertainty regions.
  operational_reliability: Fixed inputs and transformation rules reproduce the same registered field and uncertainty
    masks.
  scientific_suitability: Suitable for testing whether heterogeneous observations admit a shared constraint field;
    unsuitable for turning narrative bearings or processed tracks into direct wavefront measurements.
  calibration_status: Coordinate transforms are verified against reference grids and reversible test cases.
  alignment_status: Every source retains its original frame, transform, uncertainty, dependency weight, and unsampled
    sector.
  resolution: The registered field uses the coarsest supported scale for each region rather than the finest available
    input scale globally.
  coverage_limits:
  - Historical reports provide broad constraints rather than measured optical phase.
  - Single-site and sparse-view observations leave substantial angular and depth ambiguity.
  assumptions:
  - Transformation uncertainty is propagated and does not shrink through repeated registration.
  - Dependency weighting from the archive remains applicable to the selected historical subset.
- id: inverse_reconstruction_cluster
  name: Inverse Reconstruction Cluster
  location_id: holography_laboratory
  intended_purpose: Computes candidate three-dimensional fields from the registered constraints using documented inverse
    methods, regularization families, seeds, and stopping criteria.
  operational_reliability: Containerized runs are deterministic for fixed inputs, software versions, parameters, and
    hardware mode.
  scientific_suitability: Suitable for comparing model families and locating regions consistently excluded or bounded by
    the data; unsuitable for treating reconstructed voxels as directly observed matter.
  calibration_status: Reference phantoms, null fields, missing-angle cases, and phase-wrapping cases are included in the
    validation suite.
  alignment_status: Input transforms and uncertainty masks are hashed and stored with every reconstruction artifact.
  resolution: Reported resolution varies spatially with angular coverage, source uncertainty, and regularization
    strength.
  coverage_limits:
  - Many internal fields can fit the same incomplete boundary constraints.
  - Regularization can create smooth surfaces where the measurements provide only exclusions or discontinuities.
  assumptions:
  - Candidate methods are compared under matched input masks and documented priors.
  - Convergence of algorithms does not imply uniqueness of the physical interpretation.
- id: reconstruction_validation_rig
  name: Reconstruction Validation Rig
  location_id: holography_laboratory
  intended_purpose: Runs synthetic phantoms, withheld-input trials, parameter sweeps, null reconstructions, and
    alternate phase-unwrapping strategies against the same reconstruction chain.
  operational_reliability: Validation trials are reproducible from stored seeds, input hashes, parameter grids, and
    software images.
  scientific_suitability: Suitable for identifying reconstruction features sensitive to processing choices; unsuitable
    for proving that features surviving the tests correspond to one specific object or ontology.
  calibration_status: Known-volume, empty-field, sparse-angle, and corrupted-phase benchmarks pass within documented
    limits.
  alignment_status: Validation outputs use the same registered coordinate frame and uncertainty masks as the candidate
    model.
  resolution: Sensitivity is reported per region and reconstruction family rather than as one global confidence value.
  coverage_limits:
  - Validation cannot test unknown processing errors absent from the retained source records.
  - A feature surviving known artifact tests may still have multiple physical explanations.
  assumptions:
  - The selected artifact families cover the principal known failure modes of the implemented methods.
  - Withheld inputs are sufficiently independent to test predictive stability where dependence is documented.
- id: regional_seismic_array
  name: Regional Seismic Array
  location_id: subsurface_resonance_station
  intended_purpose: Records synchronized ground motion across permanent and temporary stations for regional event
    detection, phase comparison, and site-response analysis.
  operational_reliability: Station health, clock corrections, channel continuity, and local coupling checks are retained
    for the investigation window.
  scientific_suitability: Suitable for timing, phase, and coherence comparisons within array limits; unsuitable for
    inferring a unique source volume where station spacing and velocity structure are sparse.
  calibration_status: Sensor response and timing checks are current for retained channels.
  alignment_status: Station coordinates and clock corrections are stored with every waveform.
  resolution: Channel-dependent waveform cadence with regional location limits set by array geometry.
  coverage_limits:
  - Station density decreases outside the central basin.
  - Unknown three-dimensional velocity structure broadens depth and source-location uncertainty.
  assumptions:
  - Documented site-response corrections bound local coupling differences.
  - Clock corrections remain valid across the retained window.
- id: borehole_acoustic_string
  name: Borehole Acoustic String
  location_id: subsurface_resonance_station
  intended_purpose: Records depth-indexed acoustic and vibration response in one instrumented borehole with coupling and
    maintenance metadata.
  operational_reliability: Channel continuity and coupling checks are retained, with one depth interval marked noisy.
  scientific_suitability: Suitable for local depth-dependent timing and resonance comparison; unsuitable for
    generalizing one borehole response to the full region.
  calibration_status: Reference pulse and coupling checks bracket the investigation window.
  alignment_status: Depth registration and channel orientation are documented.
  resolution: Depth-indexed channels at the configured acoustic sampling cadence.
  coverage_limits:
  - Only one borehole samples the subsurface directly.
  - A noisy interval limits continuity across part of the depth range.
  assumptions:
  - Borehole construction and fluid column remained stable during the retained window.
- id: geological_context_workbench
  name: Geological Context Workbench
  location_id: subsurface_resonance_station
  intended_purpose: Registers mapped lithology, faults, basin geometry, attenuation estimates, and borehole control
    points into a common geological context.
  operational_reliability: Fixed source maps and transforms reproduce the same context layers.
  scientific_suitability: Suitable for testing known geological propagation and coupling; unsuitable for filling
    unsampled depth with a unique structure.
  calibration_status: Coordinate transforms are checked against surveyed control points.
  alignment_status: Every layer retains scale, date, source, and uncertainty.
  resolution: Varies by layer from surveyed boreholes to regional interpretation.
  coverage_limits:
  - Deep structure is inferred between sparse control points.
  - Several mapped units have multiple compatible velocity models.
  assumptions:
  - Published layer uncertainties remain applicable to the investigation window.
- id: electromagnetic_induction_grid
  name: Electromagnetic Induction Grid
  location_id: subsurface_resonance_station
  intended_purpose: Records synchronized magnetic and electric-field variations with cultural-noise and grounding
    metadata across the station region.
  operational_reliability: Channel continuity is documented; power-system harmonics and one grounding change are
    flagged.
  scientific_suitability: Suitable for timing and spatial-coherence comparisons after noise auditing; unsuitable for
    identifying material composition or depth without a validated conductivity model.
  calibration_status: Coil response, electrode checks, and channel gains are retained.
  alignment_status: Sensor orientation, grounding configuration, and timing offsets are recorded.
  resolution: Grid-dependent field samples at the configured acquisition cadence.
  coverage_limits:
  - Cultural noise overlaps part of the frequency band of interest.
  - Conductivity structure is not independently resolved at all depths.
  assumptions:
  - Flagged cultural-noise intervals can be bounded rather than perfectly removed.
- id: hydrogeology_infrastructure_workbench
  name: Hydrogeology and Infrastructure Workbench
  location_id: subsurface_resonance_station
  intended_purpose: Aligns groundwater levels, pumping schedules, tunnels, pipelines, traffic, and machinery logs with
    geophysical records to test ordinary coupling paths.
  operational_reliability: Retained logs are reproducibly aligned where clocks and custody are documented; several
    private-system logs are incomplete.
  scientific_suitability: Suitable for excluding or retaining known environmental and infrastructure forcing; unsuitable
    for proving absence where logs or subsurface surveys are incomplete.
  calibration_status: Time conversions and surveyed infrastructure coordinates are documented.
  alignment_status: Each source retains its original clock, precision, and custody limits.
  resolution: Ranges from minute-scale operational logs to seasonal groundwater observations.
  coverage_limits:
  - Some private infrastructure logs were not retained.
  - Groundwater monitoring is sparse outside managed wells.
  assumptions:
  - Reported operational schedules are accurate within their documented cadence.
- id: distributed_mode_analysis_cluster
  name: Distributed Mode Analysis Cluster
  location_id: subsurface_resonance_station
  intended_purpose: Computes uncertainty-aware cross-domain coherence, source-location attempts, null models,
    local-coupling controls, and distributed-mode sensitivity trials.
  operational_reliability: Containerized analyses are deterministic for fixed input hashes, parameters, masks, and
    software versions.
  scientific_suitability: Suitable for comparing point-source, local-coupling, shared-forcing, and regional-mode models;
    unsuitable for converting model fit into proof of a subterranean object.
  calibration_status: Synthetic point sources, distributed fields, null data, and coupling controls are retained.
  alignment_status: All inputs retain original coordinate frames, transforms, and uncertainty masks.
  resolution: Reported by region, depth band, source domain, and model family.
  coverage_limits:
  - Sparse depth and station coverage permit multiple compatible mode structures.
  - Unknown shared forcing can mimic part of the observed cross-domain coherence.
  assumptions:
  - Uncertainty is propagated without increasing source precision.
  - Model comparison uses matched retained inputs and documented priors.
- id: measurement_basis_registry_console
  name: Measurement-Basis Registry Console
  location_id: quantum_state_institute
  intended_purpose: Defines the observable sets, coordinate transforms, units, dependence groups, and compatibility
    relations used in the final synthesis.
  operational_reliability: Registry validation is deterministic for a fixed pack version and rejects missing units,
    undeclared transforms, and duplicate observable identifiers.
  scientific_suitability: Suitable for making basis choices explicit; unsuitable for proving that institutional
    observables are literal quantum operators.
  calibration_status: Reference registries and unit-transform tests pass for the retained content version.
  alignment_status: Every observable retains its source coordinate frame and declared transform into the synthesis
    frame.
  resolution: Reported by source field, time window, uncertainty interval, and basis definition.
  coverage_limits:
  - Only declared observables and transforms are represented.
  - Some source relations remain noncommensurate or only partially aligned.
  assumptions:
  - A basis is an analysis convention unless independent evidence establishes a physical measurement basis.
  - Transformation does not create information absent from the source record.
- id: distributed_state_preparation_controller
  name: Distributed State-Preparation Controller
  location_id: quantum_state_institute
  intended_purpose: Applies the documented inclusion, synchronization, masking, weighting, and normalization schedule to
    the cross-location records.
  operational_reliability: For fixed input hashes and protocol settings, the prepared dataset is reproducible byte for
    byte.
  scientific_suitability: Suitable for reproducible dataset preparation; unsuitable for claiming physical preparation of
    the regional phenomenon.
  calibration_status: Synthetic null, duplicated-source, missing-source, and clock-offset preparations are retained.
  alignment_status: Synchronization uses source-specific uncertainty windows rather than a single exact event time.
  resolution: One preparation record per source group, interval, mask, and normalization choice.
  coverage_limits:
  - The protocol cannot recover missing source data or unknown dependencies.
  - Synchronization may induce apparent relations among broad uncertain windows.
  assumptions:
  - Preparation choices are part of the analysis provenance and may affect the inferred state.
  - Source dependence weights are preserved from the archive analysis.
- id: cross_location_observable_assembler
  name: Cross-Location Observable Assembler
  location_id: quantum_state_institute
  intended_purpose: Builds a provenance-preserving matrix of optical, signal, aviation, archival, reconstructed, and
    geophysical observables.
  operational_reliability: Schema, hash, unit, transform, and dependence checks are deterministic for fixed inputs.
  scientific_suitability: Suitable for cross-location comparison and withholding trials; unsuitable for treating
    heterogeneous records as independent samples by default.
  calibration_status: Synthetic identity, permutation, dependence, and missing-field cases pass.
  alignment_status: Original frames, transforms, masks, and timing intervals remain attached to every matrix element.
  resolution: Reported by source group, observable, basis, and retained uncertainty.
  coverage_limits:
  - The matrix includes only retained and declared records.
  - Several observables are summaries or derived products rather than raw measurements.
  assumptions:
  - Dependence and processing history remain visible during synthesis.
  - No institutional source is conclusive in isolation.
- id: effective_tomography_cluster
  name: Effective Tomography Cluster
  location_id: quantum_state_institute
  intended_purpose: Estimates positive normalized state representations from incomplete and differently mediated
    measurement bases under declared priors.
  operational_reliability: Containerized estimators are deterministic for fixed input hashes, bases, priors,
    regularization, and solver versions.
  scientific_suitability: Suitable for comparing effective state descriptions and prediction consistency; unsuitable for
    identifying the regional phenomenon as a microscopic quantum system.
  calibration_status: Known-state, mixed-state, rank-deficient, incompatible-basis, and null synthetic controls are
    retained.
  alignment_status: Basis transforms and covariance terms are versioned with each estimate.
  resolution: Reported by basis block, eigenvalue interval, covariance estimate, and withheld-source trial.
  coverage_limits:
  - Informationally incomplete bases permit multiple compatible state estimates.
  - Correlated source products can narrow uncertainty without adding independent information.
  assumptions:
  - The density matrix is an effective statistical representation of the evidence relation.
  - Positivity and normalization are modeling constraints, not ontological proof.
- id: readout_calibration_bench
  name: Synthesis Readout Calibration Bench
  location_id: quantum_state_institute
  intended_purpose: Measures assignment, normalization, transform, timing-window, and reporting errors introduced by the
    final synthesis pipeline.
  operational_reliability: Injected-label, scale, timing, covariance, and transform errors are recovered within
    documented tolerances.
  scientific_suitability: Suitable for characterizing synthesis readout error; unsuitable for replacing upstream
    calibration or resolving unknown source bias.
  calibration_status: Current synthetic assignment matrix, transform checks, and normalization controls are retained.
  alignment_status: Readout corrections are linked to the exact basis registry and preparation protocol.
  resolution: Reported by observable, basis block, source group, and correction component.
  coverage_limits:
  - The bench cannot characterize errors absent from the retained source models.
  - Correction may amplify noise or prior dependence in weakly constrained bases.
  assumptions:
  - Readout mitigation is reported separately from raw and prepared values.
  - Upstream uncertainties are not silently converted into calibration error.
- id: observer_sensitivity_workbench
  name: Observer-Basis Sensitivity Workbench
  location_id: quantum_state_institute
  intended_purpose: Repeats state estimates and viewpoint reconstructions under alternate bases, priors, regularization,
    source withholding, and synchronization windows.
  operational_reliability: Matched trials are reproducible for fixed configurations and produce complete comparison
    manifests.
  scientific_suitability: Suitable for identifying observer- and basis-dependent features; unsuitable for eliminating
    all unmeasured descriptions.
  calibration_status: Null fields, permuted bases, synthetic interiors, exterior-only controls, and correlated-noise
    cases are retained.
  alignment_status: Each trial records the transform relating its coordinate and observer convention to the reference
    estimate.
  resolution: Reported by reconstructed feature, basis family, source withholding set, and uncertainty interval.
  coverage_limits:
  - Only tested bases, priors, and observer conventions are constrained.
  - Transient synchronization prevents direct testing of persistence outside the observation window.
  assumptions:
  - A stable relation across tested conventions is stronger evidence than one favored rendering.
  - Observer dependence is a result to report, not an error to remove automatically.
evidence_sources:
- id: optical_record
  name: Saturated Optical Array Record
  source_class: imagery
  origin_location_id: boundary_array
  instrument_id: optical_array
  provenance: Read-only export from the optical recorder acquired before interpretive annotation or image enhancement.
  independence_group: boundary_optical
  raw_or_derived: raw
  processing_history: []
  uncertainty: Peak intensity is unresolved because several channels saturated, and the single-site record does not
    determine distance.
  limitations:
  - The record does not directly establish physical distance or size.
  - The record does not directly establish material composition.
  - Partial low-elevation occlusion prevents complete angular coverage.
  supported_conclusions:
  - The array registered a luminous directional event.
  - Multiple optical channels recorded related timing changes.
  unsupported_extrapolations:
  - Exact physical size
  - Exact distance
  - Exact trajectory
  - Exact material composition
  - Identity of the phenomenon
  initially_available: false
- id: radio_return
  name: Directional Radio Return
  source_class: signal
  origin_location_id: boundary_array
  instrument_id: radio_receiver
  provenance: Receiver export preserved with the acquisition configuration and status record before later institutional
    interpretation.
  independence_group: boundary_radio
  raw_or_derived: processed
  processing_history:
  - Receiver firmware applied the configured band filtering.
  - Automatic gain control affected reported amplitude.
  uncertainty: Relative timing is usable, but absolute amplitude and directional precision depend on receiver processing
    and the incomplete post-event diagnostic.
  limitations:
  - The receiver covers only its configured frequency range.
  - A generated return does not establish exact speed, shape, size, or composition.
  supported_conclusions:
  - The configured receiver generated a directional return during the event window.
  - The return can be compared with the optical recorder on the documented timeline.
  unsupported_extrapolations:
  - Exact object speed
  - Exact object shape
  - Exact emission power
  - Material composition
  initially_available: false
- id: weather_record
  name: Local Environmental Record
  source_class: environmental_measurement
  origin_location_id: boundary_array
  instrument_id: weather_station
  provenance: Local station export retrieved from the environmental logger after the initial optical and radio records
    were secured.
  independence_group: boundary_weather
  raw_or_derived: raw
  processing_history: []
  uncertainty: Local measurements constrain near-site conditions but do not provide a full vertical or regional
    atmospheric profile.
  limitations:
  - Upper-atmosphere conditions require external records.
  - Conditions along the complete propagation path are not measured locally.
  supported_conclusions:
  - Local conditions can test some scattering and propagation explanations.
  unsupported_extrapolations:
  - Complete regional atmospheric state
  - Conditions at every possible event distance
  initially_available: false
- id: receiver_diagnostic
  name: Post-Event Receiver Diagnostic
  source_class: instrument_diagnostic
  origin_location_id: boundary_array
  instrument_id: radio_receiver
  provenance: Diagnostic output generated from the same receiver after the event under the recorded test configuration.
  independence_group: boundary_radio
  raw_or_derived: derived
  processing_history:
  - The post-event direction-finding and gain diagnostic was run after acquisition.
  uncertainty: The diagnostic constrains receiver behavior after the event but cannot prove that every parameter was
    identical during acquisition.
  limitations:
  - The diagnostic is dependent on the same receiver as the radio return.
  - Post-event behavior cannot fully reconstruct unrecorded transient state.
  supported_conclusions:
  - Recorded direction and gain uncertainties can be bounded more narrowly.
  unsupported_extrapolations:
  - Perfect receiver accuracy during the event
  - Independent corroboration of the radio return
  initially_available: false
- id: controller_voice_log
  name: Controller Communications Segment
  source_class: communications_record
  origin_location_id: aeronautical_incident_center
  instrument_id: communications_recorder
  provenance: Read-only export from the center communications recorder with channel and clock metadata preserved before
    interpretive transcription.
  independence_group: aic_controller_comms
  raw_or_derived: raw
  processing_history: []
  uncertainty: The recording preserves what was said and when within clock tolerance, but spoken directions and motion
    descriptions remain operational observations rather than measured coordinates.
  limitations:
  - The recorder contains no direct range or altitude measurement for the reported phenomenon.
  - Controller attention was divided among active traffic responsibilities.
  supported_conclusions:
  - A controller contemporaneously reported an unassociated visual and display event.
  - The sequence of calls can be compared with retained aviation and Boundary Array timestamps.
  unsupported_extrapolations:
  - Exact distance
  - Exact speed
  - Exact physical trajectory
  - Identity of the phenomenon
  initially_available: false
- id: pilot_debrief
  name: Pilot Post-Flight Debrief
  source_class: witness_testimony
  origin_location_id: aeronautical_incident_center
  instrument_id:
  provenance: Signed debrief recorded shortly after landing, preserving the original questions, answers, cockpit
    position, and stated confidence before later summaries.
  independence_group: aic_pilot_testimony
  raw_or_derived: testimony
  processing_history:
  - Audio debrief was transcribed with speaker and uncertainty annotations.
  uncertainty: The pilot provides relative bearing and apparent-motion descriptions under workload, without a direct
    range estimate or calibrated angular measurement.
  limitations:
  - Recollection was recorded after the flight rather than during the complete sighting.
  - Cockpit geometry and head position constrain but do not fix the line of sight.
  supported_conclusions:
  - The pilot reported apparent motion inconsistent with ordinary traffic identified in the transponder record.
  - The report supplies an independent human viewing geometry with stated uncertainty.
  unsupported_extrapolations:
  - Exact distance
  - Exact velocity
  - Exact size
  - Physical composition
  initially_available: false
- id: transponder_extract
  name: Cooperative Aircraft Position Extract
  source_class: navigation_record
  origin_location_id: aeronautical_incident_center
  instrument_id: transponder_data_archive
  provenance: Normalized export of participating-aircraft reports with source message identifiers, decoder version, and
    coordinate-conversion parameters retained.
  independence_group: aic_transponder
  raw_or_derived: processed
  processing_history:
  - Messages were decoded using the recorded software version.
  - Positions and times were normalized to the incident reconstruction frame.
  uncertainty: The extract locates cooperative aircraft within their reporting and navigation uncertainties but contains
    no position report attributable to the unassociated event.
  limitations:
  - Non-cooperative targets need not appear in the record.
  - Absence of a report is not evidence of absence from the airspace.
  supported_conclusions:
  - Known participating aircraft can be tested as possible sources of the observations.
  - No retained cooperative-aircraft path satisfies all reported bearings and times.
  unsupported_extrapolations:
  - Proof that the event was not an aircraft
  - A measured path for the unassociated event
  - Physical properties of an unassociated return
  initially_available: false
- id: fused_track_display
  name: Reproduced Fused Track Display
  source_class: fusion_product
  origin_location_id: aeronautical_incident_center
  instrument_id: incident_fusion_console
  provenance: Deterministic replay of the retained incident display using the recorded console build, association
    settings, coordinate transforms, and available processed inputs.
  independence_group: aic_fusion
  raw_or_derived: derived
  processing_history:
  - Operational plots and cooperative-aircraft records were transformed into one coordinate frame.
  - Association, prediction, and display smoothing generated track states between retained updates.
  uncertainty: Displayed continuity depends on association and interpolation rules, and not every contributing input is
    independently retained in raw form.
  limitations:
  - The displayed line is not a direct sample-by-sample physical trajectory.
  - Track identity can persist through prediction and association gaps.
  supported_conclusions:
  - The operational console generated and displayed an unassociated track during the incident window.
  - The console behavior can be reproduced from retained configuration and processed inputs.
  unsupported_extrapolations:
  - Exact physical trajectory
  - Exact acceleration
  - Exact object size
  - Exact object shape
  - Material composition
  initially_available: false
- id: primary_radar_plot_extract
  name: Retained Primary Radar Plot Extract
  source_class: surveillance_plot
  origin_location_id: aeronautical_incident_center
  instrument_id: surveillance_radar_archive
  provenance: Archive export of retained thresholded primary-surveillance plots with sensor status, azimuth tolerance,
    clock conversion, and extraction parameters preserved.
  independence_group: aic_primary_radar
  raw_or_derived: processed
  processing_history:
  - Receiver detections were thresholded into operational plots before archival retention.
  - Plot times were converted to the center reconstruction clock using the recorded correction.
  uncertainty: The plots constrain system-reported time and bearing within operational tolerances, but rejected
    detections and full receiver data are unavailable.
  limitations:
  - A radar plot does not directly establish size, shape, material, or identity.
  - Sparse plots do not uniquely determine a continuous path.
  - Beam geometry and thresholding vary with range and direction.
  supported_conclusions:
  - The operational sensor generated retained plots near the incident times and bearings.
  - The plot sequence can be compared with human reports and the fused display.
  unsupported_extrapolations:
  - Exact physical trajectory
  - Exact speed between plots
  - Object dimensions
  - Material composition
  initially_available: false
- id: fusion_processing_record
  name: Fusion Association and Smoothing Record
  source_class: processing_record
  origin_location_id: aeronautical_incident_center
  instrument_id: incident_fusion_console
  provenance: Configuration and replay report generated from the same console environment as the fused display,
    preserving association gates, prediction intervals, and smoothing settings.
  independence_group: aic_fusion
  raw_or_derived: derived
  processing_history:
  - A controlled replay varied association and smoothing parameters against the retained inputs.
  uncertainty: The replay identifies which displayed motions are processing-sensitive but cannot recover contributing
    raw data that the operational systems did not retain.
  limitations:
  - The record is dependent on the same fusion system as the displayed track.
  - Unretained secondary-sensor inputs cannot be independently reprocessed.
  supported_conclusions:
  - One apparent track discontinuity changes materially when interpolation is disabled.
  - Other timing and bearing disagreements remain after the display artifact is removed.
  unsupported_extrapolations:
  - Proof that every anomalous feature was a processing artifact
  - Independent corroboration of the fused track
  initially_available: false
- id: case_accession_register
  name: Selected-Case Accession Register
  source_class: archive_catalog
  origin_location_id: aerial_phenomena_archive
  instrument_id: archive_provenance_index
  provenance: Digitized accession ledger for the selected comparison set, linked to preservation masters, custody
    transfers, media generations, known derivatives, and missing originals.
  independence_group: archive_accession
  raw_or_derived: processed
  processing_history:
  - Handwritten and legacy database fields were transcribed into normalized columns.
  - Scans of the original accession pages remain linked to each normalized entry.
  uncertainty: Several early cases were entered retrospectively, so exact acquisition dates and custody intervals are
    bounded rather than complete.
  limitations:
  - Accession metadata describes records and custody, not the underlying event.
  - Absence from the selected holdings does not establish that no record existed.
  supported_conclusions:
  - Which selected records survive, at what generation, and through which documented custody chain.
  - Which later summaries or images derive from the same archival source.
  unsupported_extrapolations:
  - Authenticity of every reported event
  - Completeness of the historical record
  - Independence when provenance is unknown
  initially_available: false
- id: witness_drawing_folio
  name: Witness Drawing Folio
  source_class: witness_drawing
  origin_location_id: aerial_phenomena_archive
  instrument_id: document_imaging_station
  provenance: Preservation images of drawings from selected cases, linked to interview dates, collector notes, prompts,
    and whether each item is contemporaneous or a later redraw.
  independence_group: archive_witness_material
  raw_or_derived: testimony
  processing_history:
  - Preservation masters were captured with scale and color references.
  - Access copies were rotated and cropped with transformations recorded.
  uncertainty: Each drawing encodes memory, interpretation, drawing ability, prompts, and the delay between observation
    and depiction.
  limitations:
  - A depicted outline is not a measured silhouette or range solution.
  - Later redraws may incorporate subsequent discussion or published imagery.
  supported_conclusions:
  - What visual relations a witness chose to depict at the recorded stage of testimony.
  - Which recurring motifs remain after known copied or prompted material is separated.
  unsupported_extrapolations:
  - Exact dimensions or distance
  - A camera-equivalent view of the event
  - Proof that similar drawings depict one object
  initially_available: false
- id: historical_airspace_extract
  name: Historical Airspace Record Extract
  source_class: aviation_record
  origin_location_id: aerial_phenomena_archive
  instrument_id: archive_provenance_index
  provenance: Selected flight logs, controller notes, radar summaries, and incident forms with verifiable dates and
    locations, each labeled by record level and surviving generation.
  independence_group: archive_airspace
  raw_or_derived: processed
  processing_history:
  - Dates, coordinate references, and local times were normalized with original values retained.
  - Raw, plot-level, display-level, and summary records were labeled separately.
  uncertainty: Retention practice, timing precision, coordinate systems, and processing detail differ substantially
    among cases.
  limitations:
  - A later incident summary is not equivalent to raw radar or communications data.
  - Sparse records do not uniquely determine a continuous historical trajectory.
  supported_conclusions:
  - Some cases retain independently dated operational constraints on time, sector, or bearing.
  - Record-level differences can be carried into cross-case comparison.
  unsupported_extrapolations:
  - One physical trajectory across cases
  - Exact historical speed or size
  - A common identity for every unassociated return
  initially_available: false
- id: terminology_crosswalk
  name: Historical Terminology Crosswalk
  source_class: classification_record
  origin_location_id: aerial_phenomena_archive
  instrument_id: case_normalization_workbench
  provenance: Controlled crosswalk of period-specific military, civil, journalistic, and witness terms, preserving the
    original wording, institution, date, and later reclassification.
  independence_group: archive_classification
  raw_or_derived: summary
  processing_history:
  - Terms were mapped to comparison fields without replacing source language.
  - Later labels and editorial headings were separated from contemporaneous descriptions.
  uncertainty: The same term was used differently across institutions and decades, while different terms sometimes
    described similar observational constraints.
  limitations:
  - Vocabulary similarity does not establish observational similarity.
  - Retrospective categories can hide changes in institutional practice and public language.
  supported_conclusions:
  - How descriptive and administrative categories changed through time.
  - Which apparent recurrences survive comparison at the constraint level rather than the label level.
  unsupported_extrapolations:
  - One stable historical phenomenon category
  - Equivalence of cases sharing a label
  initially_available: false
- id: source_dependency_graph
  name: Historical Source-Dependency Graph
  source_class: provenance_analysis
  origin_location_id: aerial_phenomena_archive
  instrument_id: archive_provenance_index
  provenance: Deterministic graph generated from accession links, citation history, publication dates, duplicate images,
    shared investigators, and explicit uncertainty annotations.
  independence_group: archive_dependency_analysis
  raw_or_derived: derived
  processing_history:
  - Known derivative and custody links were encoded as directed edges.
  - Uncertain dependencies were retained as uncertain rather than removed.
  uncertainty: Missing publication, correspondence, and custody records can conceal dependencies; an absent edge is not
    proof of independence.
  limitations:
  - The graph evaluates source relationships, not whether a report is true or false.
  - Unknown relationships can only be bounded by surviving documentation.
  supported_conclusions:
  - Which cases or motifs share known documentary ancestry.
  - Which case clusters remain candidates for independent comparison after dependency weighting.
  unsupported_extrapolations:
  - Proof that every unlinked source is independent
  - Proof that a derivative report is false
  initially_available: false
- id: recurrence_sampling_matrix
  name: Dependency-Weighted Recurrence Matrix
  source_class: comparative_analysis
  origin_location_id: aerial_phenomena_archive
  instrument_id: case_normalization_workbench
  provenance: Deterministic comparison of cases remaining after dependency weighting, using documented times, locations,
    bearings, record levels, uncertainties, and current Boundary Array and Aeronautical Incident Center constraints.
  independence_group: archive_comparison
  raw_or_derived: derived
  processing_history:
  - Original terminology was mapped through the recorded crosswalk.
  - Known dependencies were down-weighted and unknown dependencies remained flagged.
  - Spatial and temporal constraints were compared without assigning a shared object model.
  uncertainty: Historical geometry is often sparse and selection-sensitive, producing broad regions rather than precise
    points or paths.
  limitations:
  - A recurring constraint pattern does not establish one cause, object, or agent.
  - The result depends on archival survival, selection rules, and normalization choices.
  supported_conclusions:
  - A dependency-weighted subset places recurring constraints around a distributed sampling pattern.
  - The pattern is more stable at the level of boundary relations than at the level of object description.
  unsupported_extrapolations:
  - Proof that every case has a common cause
  - Proof of one recurring craft or entity
  - An exact reconstruction of missing historical observations
  initially_available: false
- id: calibration_interferogram_set
  name: Wavefront Calibration Interferogram Set
  source_class: calibration_measurement
  origin_location_id: holography_laboratory
  instrument_id: coherent_wavefront_bench
  provenance: Read-only raw and minimally corrected reference interferograms acquired before, during, and after the
    candidate reconstruction series, with target certificates, environmental logs, and acquisition settings.
  independence_group: holography_calibration
  raw_or_derived: raw
  processing_history:
  - Detector dark and flat references are retained separately from the raw interferograms.
  - No phase unwrapping or model regularization is present in the preservation masters.
  uncertainty: Residual optical-path drift and detector nonlinearity are bounded for the calibrated bench geometry but
    do not characterize uncertainty in remote source records.
  limitations:
  - The set validates the laboratory chain, not the original field event.
  - Reference targets sample known geometries and cannot establish that an unfamiliar constraint field has the same
    form.
  supported_conclusions:
  - The reconstruction bench had a measured phase response during the reported run.
  - Known phase-wrapping and detector artifacts can be injected and compared with candidate outputs.
  unsupported_extrapolations:
  - Direct calibration of Boundary Array, aviation, or historical observations
  - Proof that every reconstructed feature is physical
  initially_available: false
- id: registration_reference_grid
  name: Cross-Institution Registration Reference Grid
  source_class: registration_reference
  origin_location_id: holography_laboratory
  instrument_id: multi_source_registration_workbench
  provenance: Versioned grid of coordinate transforms, clock offsets, bearing conventions, uncertainty masks, and
    dependency weights prepared from retained institutional records without replacing their original values.
  independence_group: holography_registration
  raw_or_derived: processed
  processing_history:
  - Source coordinate and time frames were copied into a reversible transformation table.
  - Unknown or noninvertible relationships were marked as unsampled rather than interpolated.
  uncertainty: Registration regions broaden where historical geometry, operational processing, or clock relationships
    are weakly constrained.
  limitations:
  - A common coordinate system does not make heterogeneous sensors equivalent.
  - The grid cannot supply phase, range, or depth values absent from the source records.
  supported_conclusions:
