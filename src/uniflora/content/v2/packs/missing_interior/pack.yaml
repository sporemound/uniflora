ordinary_explanations:
- id: atmospheric_propagation
  title: Atmospheric propagation and scattering
  description: Local cloud, moisture, inversion, scattering, or radio multipath could account for some recorded
    features. The explanation must be tested against optical, radio, and environmental timing while preserving the
    limits of the local station.
- id: track_fusion_interpolation
  title: Track association and interpolation artifact
  description: Prediction, association, and smoothing in the operational fusion console could create part of the
    apparent maneuver between sparse updates. The explanation must be tested against retained primary plots, processing
    settings, testimony, and Boundary Array timing.
- id: documentary_copying_selection_bias
  title: Documentary copying, prompting, and selection bias
  description: Repeated shapes, phrases, and case features may arise from shared publications, investigator prompts,
    editorial selection, and survival bias. The explanation must be tested against the dependency graph and against
    recurrence that remains after dependent material is down-weighted.
- id: inverse_reconstruction_artifact
  title: Inverse reconstruction and sparse-view artifact
  description: Phase wrapping, registration error, missing-angle aliasing, interpolation, regularization, or prior
    choice could create an apparent bounded absence. The explanation must be tested with calibration controls, null
    fields, alternate methods, parameter sweeps, and withheld-input trials.
- id: local_geology_infrastructure_coupling
  title: Local geology, groundwater, infrastructure, and shared forcing
  description: Known geological resonance, groundwater change, pumping, machinery, traffic, power systems, or shared
    regional forcing could produce part of the cross-domain coherence. The explanation must be tested with retained
    logs, coupling models, noise controls, source withholding, and alternate velocity structures.
- id: basis_selection_regularization_artifact
  title: Basis selection, synchronization, and regularization artifact
  description: The apparent interior viewpoint may arise from chosen basis mappings, broad synchronization windows,
    correlated inputs, normalization, readout correction, priors, or regularization. The explanation must be tested with
    alternate bases, null and permutation controls, source withholding, prior sweeps, and matched reconstructions.
contradictions:
- id: optical_radio_timing_offset
  title: Optical and radio directional peaks do not coincide
  description: The broad event windows overlap, but the strongest directional optical and radio responses remain offset
    beyond the documented clock tolerance. The difference is retained rather than averaged into a single trajectory.
- id: trajectory_solution_divergence
  title: No single continuous trajectory satisfies every retained record
  description: Within documented timing, bearing, and processing uncertainty, the controller report, pilot geometry,
    primary plots, fused display, and Boundary Array timing do not close on one continuous path. The disagreement is
    retained rather than averaged away.
- id: geometric_recurrence_description_divergence
  title: Recurring constraints coexist with incompatible descriptions
  description: After known dependencies are weighted, several cases still constrain a distributed spatial pattern, while
    drawings, labels, and apparent forms do not converge on one stable object. The mismatch is preserved rather than
    converted into a common-craft narrative.
- id: stable_boundary_indeterminate_interior
  title: A stable inferred boundary encloses an indeterminate interior
  description: Several reconstruction families and withheld-source trials retain a boundary-like exclusion region, while
    the interior field, topology, and depth vary with method and missing-angle assumptions. The disagreement is
    preserved rather than filled with a single object model.
- id: regional_coherence_without_unique_source_volume
  title: Regional coherence persists without a unique source volume
  description: A broad timing and phase relation persists across tested seismic, acoustic, electromagnetic, and
    reconstruction inputs, while point-source, cavity, and bounded-structure solutions remain non-unique or fail
    different domains. The disagreement is preserved rather than filled with an underground object.
- id: exterior_boundary_interior_viewpoint_duality
  title: The same constraints support an exterior boundary and an interior viewpoint
  description: External institutional bases represent a luminous boundary, absent volume, and regional mode, while a
    transformed joint basis yields an interior-facing relation from which those exterior constraints can be represented.
    Both descriptions remain predictive within uncertainty, and neither is treated as a direct view or allowed to erase
    the other.
information_gaps:
- id: upper_atmosphere_conditions
  title: Unmeasured upper-atmosphere and regional path conditions
  description: The local weather station does not provide the vertical and regional data needed to characterize every
    possible optical and radio propagation path.
- id: unretained_secondary_sensor_data
  title: One contributing secondary feed survives only inside the fused product
  description: The incident display lists a secondary operational input whose original plots or messages were not
    retained. Its contribution can be bounded through processing notes but cannot be independently reconstructed.
- id: missing_original_case_material
  title: Original case material is missing or survives only through derivatives
  description: Several selected cases lack original negatives, recordings, raw operational data, or complete accession
    records. Their surviving copies can be analyzed, but lost generation and custody information cannot be recreated.
- id: incomplete_angular_phase_coverage
  title: Angular and phase coverage remains incomplete
  description: No institution directly sampled all viewing angles, ranges, or coherent phases required for a unique
    volume reconstruction. Additional independent, synchronized observations from unsampled sectors are needed to
    discriminate topology and internal-field models.
- id: sparse_subsurface_multiphysics_coverage
  title: Subsurface multiphysics coverage is sparse and uneven
  description: Additional boreholes, dense peripheral stations, conductivity profiles, groundwater observations, raw
    infrastructure logs, and synchronized controls are needed to discriminate distributed modes, multiple ordinary
    sources, and shared forcing.
- id: unmeasured_bases_transient_observer
  title: Unmeasured bases and the persistence of the observer relation
  description: The network sampled only a finite set of bases during one synchronized interval. Additional independent
    basis families, repeated preparations, unsynchronized controls, and persistence tests are needed to determine
    whether the interior viewpoint is physical, informational, model-induced, or absent outside the measurement network.
actions:
- id: inspect_optical_record
  title: Inspect the optical record
  description: Separate direct channel timing and saturation from claims about distance, size, trajectory, composition,
    or identity.
  action_type: inspect
  location_id: boundary_array
  prerequisites:
    required_role_ids:
    - field_observer
    required_examined_evidence_ids:
    - optical_record
  effects: {}
  stochastic_process_id: boundary_signal_regime
  stochastic_channel_id: optical_morphology
  advance_stochastic_state: true
  position_id: boundary_event
  strategic:
    strategic_class: observe
    capacity_cost: 1
    stochastic_mode: emit_only
    emission_modifiers:
    - id: raw_snapshot_optical_quality
      target_tags:
      - coherent
      - high_information
      multiplier_basis_points: 12000
      when_condition: raw_channels_quarantined
- id: calibrate_radio_receiver
  title: Run the receiver diagnostic
  description: Check the direction-finding baseline, gain behavior, firmware configuration, and clock limits without
    treating a post-event diagnostic as independent evidence.
  action_type: calibrate
  location_id: boundary_array
  prerequisites:
