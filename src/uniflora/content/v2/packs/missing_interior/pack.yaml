roles:
- id: field_observer
  name: Field Observer
  scope: position
  description: Reviews direct optical records and distinguishes what was recorded from later claims about distance,
    size, trajectory, or identity.
  allowed_location_ids:
  - boundary_array
  allow_player_defined_name: true
  allow_player_defined_description: true
- id: instrument_operator
  name: Instrument Operator
  scope: position
  description: Checks receiver configuration, calibration history, automatic processing, and post-event diagnostic
    limits.
  allowed_location_ids:
  - boundary_array
  allow_player_defined_name: true
  allow_player_defined_description: true
- id: atmospheric_analyst
  name: Atmospheric Analyst
  scope: position
  description: Uses local and requested weather records to test propagation and scattering explanations without treating
    local measurements as the entire atmosphere.
  allowed_location_ids:
  - boundary_array
  allow_player_defined_name: true
  allow_player_defined_description: true
- id: signal_correlator
  name: Signal Correlator
  scope: position
  description: Compares optical and radio timing while retaining clock tolerance, filtering, gain control, and
    directional uncertainty.
  allowed_location_ids:
  - boundary_array
  allow_player_defined_name: true
