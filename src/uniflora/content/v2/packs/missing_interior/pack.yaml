schema_version: 3
pack:
  id: missing_interior
  title: The Missing Interior
  content_version: 2.0.0-strategic-overhaul
  initial_position_id: network_orientation
locations:
- id: boundary_array
  name: Boundary Array
  latitude: 40.88
  longitude: -119.05
  map_label: Black Rock Sector, Nevada
  public_coordinate_precision_km: 25
  description: A remote field installation that compares synchronized optical, radio, timing, diagnostic, and
    environmental records. Its purpose is to determine what the instruments actually registered before anyone assigns
    distance, scale, trajectory, material, or identity to the event.
- id: aeronautical_incident_center
  name: Aeronautical Incident Center
  latitude: 38.73
  longitude: -80.21
  map_label: Allegheny Sector, West Virginia
  public_coordinate_precision_km: 25
  description: A secured operational-analysis facility that reconstructs airspace incidents from communications, pilot
    accounts, transponder records, retained radar products, and fusion-system processing notes. Its work separates what
    each operational system displayed from claims about a single physical trajectory.
- id: aerial_phenomena_archive
  name: Aerial Phenomena Archive
  latitude: 43.25
  longitude: -90.88
  map_label: Driftless Sector, Wisconsin
  public_coordinate_precision_km: 25
  description: A controlled records facility that preserves historical case files, witness drawings, aviation extracts,
    accession histories, and terminology changes. Its work distinguishes independent recurrence from copying, editorial
    selection, and retrospective classification before any common cause is proposed.
- id: holography_laboratory
  name: Holography Laboratory
  latitude: 37.73
  longitude: -105.91
  map_label: San Luis Sector, Colorado
  public_coordinate_precision_km: 25
  description: 'A reconstruction laboratory for testing whether distributed observations constrain an absent volume without
    treating the model as the object itself.

    '
- id: subsurface_resonance_station
  name: Subsurface Resonance Station
  latitude: 47.45
  longitude: -123.53
  map_label: Cascadia Sector, Washington
  public_coordinate_precision_km: 25
  description: A distributed geophysical facility that compares seismic, borehole-acoustic, electromagnetic, geological,
    groundwater, and infrastructure records. Its work tests whether the reconstructed absence corresponds to a local
    object, known coupling, shared forcing, or a regional physical mode without treating correlation as a source
    location.
- id: quantum_state_institute
  name: Quantum State Institute
  latitude: 44.12
  longitude: -74.31
  map_label: Adirondack Sector, New York
  public_coordinate_precision_km: 25
  description: A secure analysis institute that treats the six facilities as a distributed measurement network. It maps
    differently mediated records into explicit measurement bases, estimates an effective state under documented priors,
    and tests whether an interior viewpoint appears only under synchronized cross-location observation. The institute
    does not assume that the regional phenomenon is a quantum object or that mathematical state reconstruction
    establishes ontology.
positions:
- id: network_orientation
  ordinal: 0
  title: The Network Before the Event
  focus_location_id: boundary_array
  next_position_id: boundary_event
  initially_available_location_ids:
  - boundary_array
  - aeronautical_incident_center
  - aerial_phenomena_archive
  - holography_laboratory
  - subsurface_resonance_station
  - quantum_state_institute
  available_evidence_ids_on_entry: []
  required_location_ids: []
  fixed_opening:
    presentation_id: network_orientation_fixed_opening
    prologue: At 08:00, six facility consoles become available for orientation. No incident number has been issued. The
      network map is live, the public report timeline has finished indexing, and three difficulty controls wait beside a
      form whose routing office does not appear in the directory. Players may inspect every facility, operate the
      geographic layers, and choose their personal guidance level before the first record arrives.
    guidance:
    - Tour the six facility consoles and the persistent institutional map.
    - Inspect the public-report timeline and environmental layer controls.
    - Choose a private personal guidance level in the Hypha selector.
    - Use Begin Investigation when the group is ready to receive Position 1.
  completion:
    minimum_examined_source_classes: 0
    minimum_confirmation_count: 1
- id: boundary_event
  ordinal: 1
  title: First Return
  focus_location_id: boundary_array
  next_position_id: aeronautical_incident
  initially_available_location_ids:
  - boundary_array
  available_evidence_ids_on_entry:
  - optical_record
  - radio_return
  required_location_ids:
  - boundary_array
  fixed_opening:
    presentation_id: boundary_event_fixed_opening
    prologue: At 03:17, the Boundary Array records a luminous return in the interval between two clocks that both passed
      inspection. Intake opens a file, closes it because the event has not officially begun, then opens the same file
      under a provisional number. Optical, radio, weather, timing, and diagnostic records remain separate. No distance,
      trajectory, material, or identity has been granted administrative existence.
    guidance:
    - Examine each source in its own provenance lane before comparing clocks.
    - Preserve the timing contradiction and the unmeasured upper-atmosphere gap.
  completion:
    minimum_examined_source_classes: 2
    minimum_confirmation_count: 1
    required_completed_action_ids:
    - inspect_optical_record
    - calibrate_radio_receiver
    - request_weather_record
    - compare_source_timing
    - test_atmospheric_propagation
    - document_upper_atmosphere_gap
    required_tested_ordinary_explanation_ids:
    - atmospheric_propagation
    required_preserved_contradiction_ids:
    - optical_radio_timing_offset
    required_documented_information_gap_ids:
    - upper_atmosphere_conditions
    completion_routes:
    - id: instrument_route
      title: Receiver-led reconstruction
      description: Establish the return through receiver behavior, timing comparison, atmospheric testing, and an
        explicit collection gap.
      required_action_ids:
      - calibrate_radio_receiver
      - request_weather_record
      - compare_source_timing
      - test_atmospheric_propagation
      - document_upper_atmosphere_gap
      candidate_action_ids: []
      minimum_completed_action_count: 0
      required_stochastic_process_ids:
      - boundary_signal_regime
      minimum_stochastic_observation_count: 3
    - id: environmental_route
      title: Optical-environmental reconstruction
      description: Establish the return through optical morphology, timing comparison, atmospheric testing, and an
        explicit collection gap.
      required_action_ids:
      - inspect_optical_record
      - request_weather_record
      - compare_source_timing
      - test_atmospheric_propagation
      - document_upper_atmosphere_gap
      candidate_action_ids: []
      minimum_completed_action_count: 0
      required_stochastic_process_ids:
      - boundary_signal_regime
      minimum_stochastic_observation_count: 3
- id: aeronautical_incident
  ordinal: 2
  title: The Track That Will Not Close
  focus_location_id: aeronautical_incident_center
  next_position_id: archive_convergence
  initially_available_location_ids:
  - aeronautical_incident_center
  available_evidence_ids_on_entry:
  - controller_voice_log
  - pilot_debrief
  - transponder_extract
  - fused_track_display
  required_location_ids:
  - boundary_array
  - aeronautical_incident_center
  adaptation:
    corrective:
      presentation_id: aeronautical_incident_corrective_opening
      prologue: The Boundary packet arrives as one stapled “event” whose optical, radio, weather, and timing records are
        not clearly separated. Intake has stamped every page with the same receipt time. Players receive a guided
        source-lane display and must complete reconcile_boundary_handoff before fusion analysis.
      guidance:
      - Separate optical, radio, weather, and timing provenance lanes.
      - Use the structured comparison worksheet and verify source clocks first.
      required_action_id: reconcile_boundary_handoff
    baseline:
      presentation_id: aeronautical_incident_baseline_opening
      prologue: The ordinary “five clocks” opening plays unchanged. Records arrive separated but require normal
        reconstruction and fusion auditing.
      guidance:
      - Follow the ordinary evidence order and interface guidance.
    advanced:
      presentation_id: aeronautical_incident_advanced_opening
      prologue: The handoff preserves clock offsets, processing dependencies, excluded observations, and the
        upper-atmosphere gap. An optional alternate_fusion_sensitivity_sweep becomes available with raw cross-time
        overlays.
      guidance:
      - Declare additional assumptions and uncertainty controls before the optional sweep.
      optional_action_ids:
      - alternate_fusion_sensitivity_sweep
  completion:
    minimum_examined_source_classes: 3
    minimum_confirmation_count: 1
    required_completed_action_ids:
    - review_controller_voice_log
    - review_pilot_debrief
    - inspect_transponder_extract
    - request_primary_radar_plot
    - audit_fusion_processing
    - reconstruct_relative_bearings
    - compare_boundary_and_airspace_timing
    - test_fusion_interpolation
    - document_unretained_secondary_feed_gap
    required_tested_ordinary_explanation_ids:
    - track_fusion_interpolation
    required_preserved_contradiction_ids:
    - trajectory_solution_divergence
    required_documented_information_gap_ids:
    - unretained_secondary_sensor_data
    completion_routes:
    - id: testimony_geometry_route
      title: Testimony and geometry route
      description: Use independent operational accounts to reconstruct relative constraints, then test the display
        product without claiming a single trajectory.
      required_action_ids:
      - review_controller_voice_log
      - review_pilot_debrief
      - reconstruct_relative_bearings
      - test_fusion_interpolation
      - document_unretained_secondary_feed_gap
      candidate_action_ids:
      - inspect_transponder_extract
      - compare_boundary_and_airspace_timing
      minimum_completed_action_count: 1
      required_stochastic_process_ids:
      - airspace_track_regime
      minimum_stochastic_observation_count: 2
    - id: sensor_provenance_route
      title: Sensor provenance route
      description: Recover and audit retained sensor products before reconstructing what the fused display can and
        cannot support.
      required_action_ids:
      - request_primary_radar_plot
      - audit_fusion_processing
      - reconstruct_relative_bearings
      - test_fusion_interpolation
      - document_unretained_secondary_feed_gap
      candidate_action_ids:
      - inspect_transponder_extract
      - compare_boundary_and_airspace_timing
      minimum_completed_action_count: 1
      required_stochastic_process_ids:
      - airspace_track_regime
      minimum_stochastic_observation_count: 3
- id: archive_convergence
