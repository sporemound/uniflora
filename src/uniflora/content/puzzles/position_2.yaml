  world_flags:
    translation_concordance: true
    plural_records_preserved: true
  next_position: 3
  response_profile: plural_translation
response_profile_changes: {on_completion: plural_translation}
narration_keys:
  orient_local: local_orientation
  observe_new: observation_unlocked
  observe_repeat: observation_corroborated
  action_accepted: accepted
  proposal_rejected: proposal_rejected
  proposal_accepted: proposal_accepted
  confirmation_recorded: confirmation_recorded
  position_completed: position_completed
  industrial_draw_discovered: industrial_draw_discovered
  returned_water_ambiguity: returned_water_ambiguity
  fungal_bed_compatibility: fungal_bed_compatibility
  visible_clarification_without_safety_evidence: visible_clarification_without_safety_evidence
  substrate_containment: substrate_containment
accessibility:
  summary: >-
    Ask Hypha about one record, instrument, signature, term, or margin note, then compare what the
    public record establishes. Mention or reply to Hypha for ordinary language; slash commands
    remain the reliable fallback. Recall preserves provenance and disagreement, while chart shows
    the action flow and concordance requirements. No speed, private clue, or forced agreement is
    required.
  accepted_input_modes: [natural_language, explicit_command]
  explicit_command_help:
    - "Discover: use /interior act observe and choose an inspectable public cue; Hypha reveals its record or entity only when its prerequisites are public."
    - "Compare and clarify two public records before classifying their difference."
    - "Relay or annotate an account without replacing its own term or provenance."
    - "Propose a translation only after all three stages and the minority warning are public; Discord exposes the concordance fields."
    - "Another participant confirms or challenges the proposal; the author cannot self-confirm."
    - "Use /interior chart for the full flow and /interior recall for public record IDs and established differences."
orientation:
  local_response: One nearby record surface resolves, including its own stage marker and signature.
  specificity_invitation: Name one visible record, instrument, term, signature, or margin note and ask what it establishes.
  prohibited_automatic_reveals:
    - all record names
    - complete terminology mapping
    - every provenance relation
    - unresolved minority reports
    - complete public-state recap
presentation:
  image_asset: assets/position_2_translation.png
  image_alt_text: >-
    A sepia botanical-field-guide panorama titled Translation, showing a public settlement court
    where workers compare signed diagrams, measurement boards, vessels, planted specimens, and
    circulation records without collapsing their distinct sources or stages.
  introduction: |-
    ## POSITION 2 — TRANSLATION

    The circulation holds. Its public records do not appear to agree.

    A source ledger, a boundary sensor, and a later retention survey describe the same movement through different instruments, terms, and moments. Their apparent contradiction cannot be resolved by choosing one record as authoritative and discarding the others.

    Translation requires comparison before consensus. Trace where each record was made, clarify what its terms measure, and preserve the minority warning that delivery and later retention are not interchangeable.

    No hidden record decides the answer. Provenance, differences, annotations, and summaries remain public.

    Functions remain temporary. Readers, comparators, terminologists, provenance auditors, relays, dissent archivists, and editors may each expose a different part of the relation.

    Begin with one record or instrument. Mention or reply to Hypha to ask what it establishes, or use `/interior chart` for the concise action flow. `/interior accessibility` remains a fallback when inference stalls.

    Agreement is not accuracy if it erases when and where a measurement became true.
vocabulary: [sent, delivered, retained, returned, reusable, withdrawn, circulated, treated, clarified, degraded, immobilized, accumulated, transformed, provenance, chronology, terminology, minority, difference]
world_flags:
  translation_concordance: false
  plural_records_preserved: false
  material_terms_ledger: false
  remediation_processes_distinguished: false
