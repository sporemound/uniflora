      contaminant_classes: [organic_dye_residue, wood_treatment_residue, mineral_glaze_runoff, oily_maintenance_residue, saline_wash_water, mixed_unknown_discharge]
      culture_ids: [warm_season_indicator_line]
      containment_destination_ids: [spent_substrate_court]
      moisture_required: true
