response_profile_changes: {on_completion: plural_translation}
reinterpretation_rules:
  production: Production counts as provision only where verified public need and ecological limits govern it.
  employment: Livelihood protection requires wages, transition work, training, or shared ownership; employment does not erase burden.
  returned_water: Returned volume is not usable volume without public evidence.
  remediation: Source reduction, separation, and containment precede any compatible fungal role.
  public_control: Local and worker-community authority may enforce caps, reassessment, seasonal pause, and shutdown.
  historical_memory: Every reconstruction inherits the versioned failed-treatment archive and its unresolved conflicts.
vocabulary:
