  thresholds:
    saturation_limit: 3
    minimum_viability: 2
    minimum_containment: 2
    minimum_evidence: 2
    maximum_throughput: 6

  climate_record:
    historical_baseline: Cooler seasons once supported predictable well recovery, condensation, and maintenance intervals.
    current_measurement: Longer heat periods, lower condensation, and slower groundwater recovery now constrain water and fungal viability.
    forecast: Low-flow heat periods will concentrate burden and shorten safe maintenance cycles if throughput remains high.
    conditional_projection: Reduced throughput, protected public water, and seasonal review can keep bounded systems viable for monitored roles.
    obsolete_expectation: Annual cooling and groundwater recovery will automatically restore the Works to its former operating envelope.
    unresolved_discrepancy: Public records cannot fully separate climate-driven decline from the effects of repeated industrial extraction.

  remediation_hierarchy:
    - refuse_unnecessary_production
    - reduce_harmful_inputs
    - redesign_production
    - reuse_verified_safe_material
    - separate_clean_and_contaminated_flows
    - contain_unavoidable_waste
    - remediate_compatible_contamination
    - monitor_long_term_effects
    - manage_spent_substrate

  counter_defaults:
