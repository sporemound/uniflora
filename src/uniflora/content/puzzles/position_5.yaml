response_profile_changes: {on_completion: plural_translation}
reinterpretation_rules:
  original_claim: Preserve the original wording, provenance, and measurement boundary.
  later_revision: Attach the revision without overwriting the claim it changes.
  physical_evidence: Keep visible change separate from contaminant-specific evidence.
  uncertainty: Record what transformation, accumulation, and downstream effect remain unresolved.
  correction: Publish the correction beside every prior version.
  unresolved_conflict: Preserve disagreement until public evidence resolves it.
